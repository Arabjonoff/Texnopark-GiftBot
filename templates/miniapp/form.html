<!-- Form Modal Component -->
<div id="lead-modal-standalone" class="modal-card">
  <div class="modal-header">
    <h3>O'quvchi Ma'lumotlari</h3>
    <p>Yutuqni biriktirish va QR-kod olish uchun to'ldiring:</p>
  </div>
  <form id="lead-form-standalone">
    <div class="form-group">
      <label>Ism</label>
      <input type="text" name="first_name" class="form-control" required>
    </div>
    <div class="form-group">
      <label>Familiya</label>
      <input type="text" name="last_name" class="form-control">
    </div>
    <div class="form-group">
      <label>Telefon raqam</label>
      <input type="tel" name="phone_number" class="form-control" required>
    </div>
    <button type="submit" class="btn-submit">Yutuqni Olish</button>
  </form>
</div>
